<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DEENHA | Modest Fashion Elegant & Syar'i</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.frankfurter.app" crossorigin>

  <!-- Preload LCP image only — videos lazy-loaded to save bandwidth -->
  <link rel="preload" as="image" href="/images/ramadan_banner.jpg" fetchpriority="high">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* HIDE GOOGLE TRANSLATE UI COMPLETELY */
    .goog-te-banner-frame.skiptranslate,
    .goog-te-gadget-icon,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    .goog-te-menu-value img,
    .goog-tooltip,
    .goog-tooltip:hover {
      display: none !important;
    }

    .goog-text-highlight {
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    body {
      top: 0 !important;
    }

    .skiptranslate iframe {
      display: none !important;
    }

    #google_translate_element {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="google_translate_element"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'id',
        includedLanguages: 'id,en,fr,zh-CN',
        autoDisplay: false
      }, 'google_translate_element');
    }

    // Fungsi jembatan yang lebih kuat
    window.triggerTranslate = function (langCode) {
      var select = document.querySelector('.goog-te-combo');
      var domain = window.location.hostname;

      if (langCode === 'id') {
        // Balik ke Indo: Hapus cookie & reset select
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + domain;
        if (select) {
          select.value = 'id';
          select.dispatchEvent(new Event('change'));
        }
        setTimeout(function () { window.location.reload(); }, 100); // Reload cepat untuk reset total
        return;
      }

      // Set cookie agar persisten
      document.cookie = "googtrans=/id/" + langCode + "; path=/;";
      document.cookie = "googtrans=/id/" + langCode + "; path=/; domain=" + domain;

      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      } else {
        setTimeout(function () {
          var selectRetry = document.querySelector('.goog-te-combo');
          if (selectRetry) {
            selectRetry.value = langCode;
            selectRetry.dispatchEvent(new Event('change'));
          }
        }, 500);
      }
    }
    // Add Google Translate Script Lazily - AFTER fonts are loaded
    window.addEventListener('load', function () {
      // Wait for fonts to load before injecting Google Translate
      document.fonts.ready.then(function() {
        setTimeout(function () {
          var gtScript = document.createElement('script');
          gtScript.type = 'text/javascript';
          gtScript.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
          gtScript.defer = true;
          document.body.appendChild(gtScript);
        }, 500); // Reduced from 1500ms since fonts are ready
      });
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
