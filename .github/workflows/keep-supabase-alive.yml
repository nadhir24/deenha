name: Keep Supabase Alive

on:
  schedule:
    # Run every 5 days at 08:00 UTC to prevent Supabase free tier auto-pause (7 day limit)
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Supabase responded with HTTP $response"
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "Supabase is alive!"
            exit 0
          else
            echo "WARNING: Supabase returned $response"
            exit 1
          fi
