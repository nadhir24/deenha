<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DEENHA World Series — Pop-Out Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0b0c; --ink:#f4f1ec; --dim:#8d8a84; --gold:#c9a227;
  --w1:#5e2c24; --w1-light:#8f4d3e; --w2:#0f1a33; --w2-gold:#c9a227; --w3:#3d4f3f; --w3-light:#6b826d;
}
html,body{height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.serif{font-family:'Cormorant Garamond',serif}
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}

#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .9s ease,visibility .9s}
#loader.done{opacity:0;visibility:hidden}
.logo{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,7vw,74px);letter-spacing:.34em;padding-left:.34em;color:transparent;background:linear-gradient(90deg,var(--ink) var(--p,0%),rgba(244,241,236,.16) var(--p,0%));-webkit-background-clip:text;background-clip:text}
.bar{width:min(420px,62vw);height:1px;background:rgba(244,241,236,.14);position:relative}
.bar i{position:absolute;inset:0;width:var(--p,0%);background:var(--gold)}
.pct{font-size:11px;letter-spacing:.28em;color:var(--dim)}
.loadmsg{font-size:10px;letter-spacing:.3em;color:#5c5a56;text-transform:uppercase;height:12px}

#stage{position:fixed;inset:0;overflow:hidden}
.world-scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .85s,visibility .85s}
.world-scene.active{opacity:1;visibility:visible}

/* colored flat bg */
.bg-layer{position:absolute;inset:0;transition:background .9s}
.scene-heritage .bg-layer{background:radial-gradient(ellipse at 70% 30%,var(--w1-light) 0%,var(--w1) 55%,#2b1613 100%)}
.scene-cities .bg-layer{background:radial-gradient(ellipse at 30% 20%,#1a2747 0%,var(--w2) 55%,#060912 100%)}
.scene-new .bg-layer{background:radial-gradient(ellipse at 60% 30%,var(--w3-light) 0%,var(--w3) 55%,#1f2a20 100%)}

/* giant title behind figure */
.giant-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;z-index:1;pointer-events:none;font-family:'Cormorant Garamond',serif;font-weight:300;color:rgba(244,241,236,.10);font-size:clamp(64px,18vw,240px);line-height:.85;letter-spacing:-.02em;text-align:center;transition:opacity .6s}
.active .giant-title{opacity:1}
.scene-cities .giant-title{color:rgba(201,162,39,.16);font-family:Inter,sans-serif;font-weight:400;letter-spacing:.04em;font-size:clamp(48px,14vw,200px)}
.scene-new .giant-title{color:rgba(244,241,236,.14);font-family:Inter,sans-serif;font-style:italic;font-weight:400}

/* mini floating elements */
.mini{position:absolute;z-index:1;opacity:.55;filter:blur(1.5px);transition:transform 1.4s ease,opacity .6s}
.scene-heritage .m1{left:8%;top:22%;width:min(110px,14vw);animation:float 6s ease-in-out infinite}
.scene-heritage .m2{right:10%;bottom:18%;width:min(130px,16vw);animation:float 7s ease-in-out infinite .8s}
.scene-heritage .m3{left:18%;bottom:30%;width:min(70px,9vw);animation:float 5.5s ease-in-out infinite .3s}
.scene-cities .m1{left:10%;top:25%;width:min(90px,11vw);animation:float 6.5s ease-in-out infinite}
.scene-cities .m2{right:8%;bottom:22%;width:min(110px,13vw);animation:float 7.5s ease-in-out infinite 1s}
.scene-new .m1{left:12%;top:30%;width:min(80px,10vw);animation:float 6s ease-in-out infinite .5s}
.scene-new .m2{right:15%;bottom:25%;width:min(70px,9vw);animation:float 6.8s ease-in-out infinite}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

/* central figure */
.figure{position:absolute;z-index:3;bottom:0;left:50%;height:min(88vh,900px);width:auto;transform:translateX(-50%);transition:transform 1.1s cubic-bezier(.22,1,.36,1),opacity .9s;opacity:0;filter:drop-shadow(0 40px 80px rgba(0,0,0,.45))}
.active .figure{opacity:1}
.figure img{height:100%;width:auto;max-width:100vw;object-fit:contain}

/* text overlay */
.copy{position:absolute;z-index:4;left:clamp(26px,6vw,80px);top:50%;transform:translateY(-50%);max-width:min(420px,36vw);transition:opacity .7s .2s,transform .7s .2s;opacity:0}
.active .copy{opacity:1;transform:translateY(-50%)}
.copy h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(32px,5vw,62px);line-height:1.02;margin:12px 0 14px}
.copy p{font-size:13px;color:rgba(244,241,236,.78);line-height:1.7;max-width:34ch}
.copy .meta{margin-top:18px;display:flex;gap:14px;align-items:center}
.copy .meta span{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.copy .enter{margin-top:22px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.copy .enter:hover{color:var(--gold)}

.world-index{position:absolute;right:clamp(26px,6vw,80px);top:50%;transform:translateY(-50%);z-index:4;text-align:right;opacity:0;transition:opacity .7s}
.active .world-index{opacity:1}
.world-index .num{font-family:'Cormorant Garamond',serif;font-size:clamp(72px,12vw,160px);color:rgba(244,241,236,.10);line-height:1}
.world-index .label{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}

.topbar{position:fixed;top:26px;left:0;right:0;display:flex;justify-content:space-between;padding:0 34px;z-index:20;pointer-events:none}
.topbar .mark{font-family:'Cormorant Garamond',serif;letter-spacing:.3em;font-size:14px}
.hint{position:fixed;bottom:26px;left:0;right:0;text-align:center;z-index:20;font-size:10px;letter-spacing:.28em;color:#6d6a65;text-transform:uppercase}

.arrow{position:fixed;top:50%;translate:0 -50%;z-index:30;width:52px;height:52px;border:1px solid rgba(244,241,236,.18);border-radius:50%;background:rgba(11,11,12,.35);color:var(--ink);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:.35s}
.arrow:hover{border-color:var(--gold);color:var(--gold);scale:1.08}
#prev{left:28px}#next{right:28px}
.arrow svg{width:16px;height:16px}
.dots{position:fixed;bottom:64px;left:0;right:0;display:flex;gap:9px;justify-content:center;z-index:20}
.dots i{width:24px;height:1px;background:rgba(244,241,236,.2);transition:.4s}
.dots i.on{background:var(--gold)}

#sub{position:fixed;inset:0;z-index:60;background:#0b0b0c;opacity:0;visibility:hidden;transition:opacity .7s;overflow-y:auto;overscroll-behavior:contain}
#sub.open{opacity:1;visibility:visible}
.back{position:fixed;top:24px;left:28px;z-index:70;background:none;border:0;cursor:pointer;color:var(--dim);font-size:10px;letter-spacing:.3em;text-transform:uppercase;display:flex;gap:9px;align-items:center}
.back:hover{color:var(--ink)}
.subhead{position:sticky;top:0;z-index:5;padding:clamp(58px,9vh,84px) 34px 22px;background:linear-gradient(#0b0b0c 84%,rgba(11,11,12,.86) 96%,rgba(11,11,12,0))}
.subhead h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(38px,7vw,84px);line-height:.98;margin-top:10px}
.subhead .lede{margin-top:14px;font-size:13px;color:var(--dim);max-width:46ch;line-height:1.7}
.serieslist{padding:0 34px 120px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid rgba(244,241,236,.14);cursor:pointer;opacity:0;transform:translateY(26px);animation:rise .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.card img{width:100%;height:100%;object-fit:cover;filter:brightness(.74);transition:1.2s}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(6,6,7,.95) 2%,rgba(6,6,7,.45) 34%,rgba(6,6,7,0) 62%)}
.card:hover img{transform:scale(1.05);filter:brightness(.9)}
.card .c{position:absolute;left:18px;right:18px;bottom:18px;z-index:2}
.card .soon{z-index:2}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:28px;margin:6px 0 5px}
.card p{font-size:11.5px;color:rgba(244,241,236,.82);line-height:1.5}
.card .eyebrow{color:rgba(244,241,236,.72)}
.soon{position:absolute;top:14px;right:14px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#0b0b0c;background:var(--gold);padding:4px 8px}
@media(max-width:900px){
  .copy{left:24px;right:24px;max-width:none;top:auto;bottom:110px;transform:translateY(0);text-align:center}
  .active .copy{transform:translateY(0)}
  .copy p{max-width:none;color:rgba(244,241,236,.9)}
  .world-index{right:24px;top:90px;transform:none}
  .figure{height:min(72vh,560px)}
  .giant-title{font-size:clamp(48px,14vw,120px)}
}
@media(max-width:640px){#prev{left:10px}#next{right:10px}.serieslist,.subhead{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>

<div id="loader">
  <div class="logo" id="logo">DEENHA</div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="pct" id="pct">0%</div>
  <div class="loadmsg" id="lmsg">Preparing the archive</div>
</div>

<div id="stage"></div>
<div id="vignette" style="position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 240px 60px rgba(0,0,0,.75);z-index:10"></div>

<div class="topbar">
  <div class="mark">DEENHA</div>
  <div class="eyebrow">World Series</div>
</div>
<div class="dots" id="dots"></div>
<div class="hint" id="hint">← → untuk memutar dunia · klik untuk masuk</div>

<button class="arrow" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="arrow" id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 5l7 7-7 7"/></svg></button>

<div id="sub">
  <button class="back" id="back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M15 5l-7 7 7 7"/></svg> Kembali ke pilihan dunia</button>
  <div class="subhead">
    <div class="eyebrow" id="subEyebrow">DEENHA WORLD</div>
    <h1 id="subTitle">Heritage</h1>
    <div class="lede" id="subLede"></div>
  </div>
  <div class="serieslist" id="serieslist"></div>
</div>

<script>
const WORLDS = [
  { id:'heritage', cls:'scene-heritage', eyebrow:'World 01 — Wastra Nusantara', title:'Heritage\nTextile', giant:'Heritage Textile',
    desc:'Batik, songket, tenun. Wastra yang ditelusuri asalnya, lalu diterjemahkan jadi pakaian sehari-hari.',
    meta:['5 Series','Live'], img:'img/songket.jpg', figure:'img/songket.jpg', idx:'01',
    lede:'Setiap seri lahir dari satu wastra: motifnya, daerahnya, dan alasan ia pernah dipakai. Scan QR di packaging untuk cerita lengkapnya.',
    items:[
      {t:'Songket',d:'Threads of ceremony, translated for today.',img:'img/songket.jpg',scroll:'songket-scroll.html'},
      {t:'Parang',d:'A graphic rhythm reimagined for drape.',img:'img/parang.jpg'},
      {t:'Lombok',d:'Earth, rhythm, a softer language of pattern.',img:'img/lombok.jpg'},
      {t:'Kawung',d:'A measured geometry with a calm pulse.',img:'img/kawung.jpg'},
      {t:'Borneo',d:'Organic lines, vivid memory, living surface.',img:'img/borneo.jpg'}
    ]},
  { id:'cities', cls:'scene-cities', eyebrow:'World 02 — Kota Islam Dunia', title:'Cities of\nIslam', giant:'Cities of Islam',
    desc:'Cordoba, Istanbul, Samarkand, Demak, Aceh. Arsitektur dan sejarahnya jadi motif.',
    meta:['4 Series','New Series'], img:'img/hagia.jpg', figure:'img/hagia.jpg', idx:'02',
    lede:'Dari Alhambra sampai Baiturrahman. Ornamen, geometri, dan warna kota-kota yang membentuk peradaban Islam.',
    items:[
      {t:'Hagia Sophia',d:'Domes, light, and centuries of layered faith.',img:'img/hagia.jpg'},
      {t:'Alhambra Cordoba',d:'Muqarnas geometry in andalusian dusk.',img:'img/hagia.jpg',soon:'Soon'},
      {t:'Samarkand',d:'Silk road blues and glazed tilework.',img:'img/arabic.jpg',soon:'Soon'},
      {t:'Baiturrahman Aceh',d:'Seven domes, one enduring silhouette.',img:'img/borneo.jpg',soon:'Soon'}
    ]},
  { id:'new', cls:'scene-new', eyebrow:'World 03 — Studio', title:'New\nArrival', giant:'New Arrival',
    desc:'Abstract, monogram, dan eksperimen studio di luar dua lini utama.',
    meta:['3 Series','Abstract'], img:'img/arabic.jpg', figure:'img/arabic.jpg', idx:'03',
    lede:'Ruang main DEENHA: warna, gradasi, dan bentuk tanpa narasi sejarah. Rilis terbatas.',
    items:[
      {t:'Arabic Series',d:'Calligraphic strokes as pure form.',img:'img/arabic.jpg'},
      {t:'Monogram Gradasi',d:'The house mark, dissolved into gradient.',img:'img/parang.jpg'},
      {t:'Alyssum',d:'Florals abstracted until only rhythm remains.',img:'img/lombok.jpg',soon:'Soon'}
    ]}
];

const stage = document.getElementById('stage');
WORLDS.forEach((w,i)=>{
  const s = document.createElement('section');
  s.className = `world-scene ${w.cls} ${i===0?'active':''}`;
  s.dataset.i = i;
  s.innerHTML = `
    <div class="bg-layer"></div>
    <div class="giant-title">${w.giant.replace('\\n','<br>')}</div>
    <div class="mini m1"><svg viewBox="0 0 100 100" width="100%" fill="none" stroke="currentColor" stroke-width="1"><circle cx="50" cy="50" r="40"/><path d="M50 10v80M10 50h80"/></svg></div>
    <div class="mini m2"><svg viewBox="0 0 100 100" width="100%" fill="none" stroke="currentColor" stroke-width="1"><rect x="20" y="20" width="60" height="60"/><circle cx="50" cy="50" r="18"/></svg></div>
    <div class="mini m3"><svg viewBox="0 0 100 100" width="100%" fill="none" stroke="currentColor" stroke-width="1"><polygon points="50,10 90,90 10,90"/></svg></div>
    <div class="figure"><img src="${w.figure}" alt="${w.title.replace('\\n',' ')}"></div>
    <div class="copy">
      <div class="eyebrow">${w.eyebrow}</div>
      <h2 class="serif">${w.title.replace('\\n','<br>')}</h2>
      <p>${w.desc}</p>
      <div class="meta">${w.meta.map(m=>`<span>${m}</span>`).join('')}</div>
      <div class="enter" data-i="${i}">Masuk dunia ini →</div>
    </div>
    <div class="world-index"><div class="num">${w.idx}</div><div class="label">World</div></div>
  `;
  stage.appendChild(s);
  s.querySelector('.enter').addEventListener('click',e=>{e.stopPropagation();openSub(i)});
  s.addEventListener('click',()=>openSub(i));
});
const scenes=[...document.querySelectorAll('.world-scene')];
const dots=document.getElementById('dots');
WORLDS.forEach((_,i)=>{const d=document.createElement('i');if(!i)d.className='on';dots.appendChild(d)});

let cur=0;
function go(n){
  cur=(n+WORLDS.length)%WORLDS.length;
  scenes.forEach((s,i)=>s.classList.toggle('active',i===cur));
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{
  if(document.getElementById('sub').classList.contains('open')){if(e.key==='Escape')closeSub();return;}
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='Enter')openSub(cur);
});
let wheelLock=0;
addEventListener('wheel',e=>{
  if(document.getElementById('sub').classList.contains('open'))return;
  const now=Date.now();if(now-wheelLock<520)return;wheelLock=now;
  go(cur+(e.deltaY>0?1:-1));
},{passive:true});
let sx=null;
addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{
  if(document.getElementById('sub').classList.contains('open'))return;
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));sx=null;
},{passive:true});

const sub=document.getElementById('sub');
function openSub(i){
  const w=WORLDS[i];
  document.getElementById('subEyebrow').textContent=w.eyebrow;
  document.getElementById('subTitle').innerHTML=w.title.replace('\\n',' ');
  document.getElementById('subLede').textContent=w.lede;
  const list=document.getElementById('serieslist');list.innerHTML='';
  w.items.forEach((it,k)=>{
    const c=document.createElement('div');c.className='card';
    c.style.animationDelay=(k*70)+'ms';
    c.innerHTML=`<img src="${it.img}" alt="${it.t}">${it.soon?`<span class="soon">${it.soon}</span>`:''}
      <div class="c"><div class="eyebrow">${w.title.replace('\\n',' ')} World</div>
      <h3>${it.t}</h3><p>${it.d}</p></div>`;
    if(it.scroll) c.addEventListener('click',()=>location.href=it.scroll);
    list.appendChild(c);
  });
  sub.scrollTop=0;sub.classList.add('open');
}
function closeSub(){sub.classList.remove('open')}
document.getElementById('back').onclick=closeSub;

const imgs=[...new Set(WORLDS.flatMap(w=>[w.img,w.figure,...w.items.map(i=>i.img)]))];
const msgs=['Preparing the archive','Loading wastra textures','Building the worlds','Almost there'];
let loaded=0,shown=0;
const target=()=>Math.round(loaded/imgs.length*100);
imgs.forEach(src=>{const im=new Image();im.onload=im.onerror=()=>loaded++;im.src=src});
const tick=setInterval(()=>{
  const t=Math.max(target(),Math.min(96,shown+1));if(shown<t)shown++;
  document.getElementById('pct').textContent=shown+'%';
  document.getElementById('logo').style.setProperty('--p',shown+'%');
  document.getElementById('barfill').style.width=shown+'%';
  document.getElementById('lmsg').textContent=msgs[Math.min(3,Math.floor(shown/26))];
  if(shown>=100){clearInterval(tick);enter()}
  else if(loaded>=imgs.length&&shown>=96)shown=99;
},22);
function enter(){
  document.getElementById('loader').classList.add('done');
  scenes.forEach((s,i)=>s.classList.add('active'));
  setTimeout(()=>scenes.forEach((s,i)=>{if(i!==cur)s.classList.remove('active')}),200);
}
</script>
</body>
</html>
